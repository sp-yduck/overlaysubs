[workspace]
resolver = "2"
members = ["crates/core", "src-tauri"]

# Single source of truth for the app version. The member crates inherit it with
# `version.workspace = true`, and Tauri falls back to the Cargo package version because
# src-tauri/tauri.conf.json has no "version" field. Bump it with scripts/set-version.sh.
[workspace.package]
version = "0.6.0"
