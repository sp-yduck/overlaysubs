[package]
name = "floatsubs"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Local real-time speech translation overlay"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
floatsubs-core = { path = "../crates/core" }
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.16"
whisper-rs = "0.16"
llama-cpp-2 = { version = "0.1.161", features = ["dynamic-link"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
sha2 = "0.10"
sysinfo = "0.37"

[features]
vulkan = ["whisper-rs/vulkan", "llama-cpp-2/vulkan"]
cuda = ["whisper-rs/cuda", "llama-cpp-2/cuda"]
metal = ["whisper-rs/metal", "llama-cpp-2/metal"]
