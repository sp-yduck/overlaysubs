[package]
name = "overlaysubs"
version = "0.3.0"
edition = "2021"
license = "MIT"
description = "Local real-time speech translation overlay"
repository = "https://github.com/sp-yduck/overlaysubs"
homepage = "https://sp-yduck.github.io/overlaysubs/"
readme = "../README.md"
keywords = ["translation", "speech-recognition", "overlay", "tauri", "whisper"]
categories = ["multimedia::audio", "gui"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
overlaysubs-core = { path = "../crates/core" }
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.18"
whisper-rs = "0.16"
# shortcut: crates.io 0.1.161 predates the plamo3 tokenizer; move back to a release once one includes it.
llama-cpp-2 = { git = "https://github.com/utilityai/llama-cpp-rs", rev = "0364f5da1c6a6ee37f507031f116ce4a09b28594", features = ["dynamic-link"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
sha2 = "0.11"
sysinfo = "0.40"

# macOS system audio comes from ScreenCaptureKit: cpal only sees input devices there, and a
# loopback/virtual audio driver would have to be installed by the user.
[target.'cfg(target_os = "macos")'.dependencies]
screencapturekit = { version = "11.1.2", features = ["macos_13_0"] }

[features]
vulkan = ["whisper-rs/vulkan", "llama-cpp-2/vulkan"]
cuda = ["whisper-rs/cuda", "llama-cpp-2/cuda"]
metal = ["whisper-rs/metal", "llama-cpp-2/metal"]
