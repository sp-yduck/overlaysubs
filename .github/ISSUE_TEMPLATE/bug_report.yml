name: Bug report
description: Report a problem
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Before you start, check the [FAQ on the official site](https://sp-yduck.github.io/overlaysubs/#faq) and the existing issues.

        **Do not report security issues as public issues. Report them privately following [SECURITY.md](https://github.com/sp-yduck/overlaysubs/blob/main/SECURITY.md).**

  - type: checkboxes
    id: preflight
    attributes:
      label: Before you report
      options:
        - label: I searched the existing issues and this problem has not been reported
          required: true
        - label: I have accepted the Terms of Use shown on first launch
          required: true

  - type: input
    id: version
    attributes:
      label: OverlaySubs version
      description: You can find it on the "About" page of the app or in the name of the file you downloaded.
      placeholder: "0.6.0"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: OS
      options:
        - Windows 11 (x64)
        - Windows 10 (x64)
        - macOS 15 (Apple Silicon)
        - macOS 14 (Apple Silicon)
        - macOS 13 (Apple Silicon)
        - Other
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: CPU / GPU / VRAM / memory
      description: Paste what "Check this PC" in the settings window shows. Partial information is fine.
      value: |
        - CPU:
        - GPU:
        - VRAM:
        - Memory:
        - Audio source: System audio / Microphone
    validations:
      required: true

  - type: dropdown
    id: tier
    attributes:
      label: Tier (shown in the settings window)
      options:
        - High
        - Mid
        - Low
        - CPU
        - Not sure
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Describe the steps that lead to the problem.
      placeholder: |
        1. Start OverlaySubs
        2. Select "..."
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: false

  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: If a message or toast is shown, paste it verbatim.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs, error messages, and notes
      description: |
        The current version does not write log files. Paste any error message shown on screen verbatim.
        You can find the model folder under "Set up models" → "Folder" in the settings window.
        You can drag screenshots or videos into this field.
    validations:
      required: false
