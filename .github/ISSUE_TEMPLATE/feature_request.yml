name: 機能要望
description: 新機能や改善の提案
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        機能要望ありがとうございます。まず [README](https://github.com/sp-yduck/overlaysubs#readme) と既存の Issue で、同じ提案がないか確認してください。

        **セキュリティ上の問題は公開 Issue に書かず、[SECURITY.md](https://github.com/sp-yduck/overlaysubs/blob/main/SECURITY.md) の手順で報告してください。**

  - type: checkboxes
    id: preflight
    attributes:
      label: 提案前の確認
      options:
        - label: 既存の Issue を検索して、同じ提案がないことを確認しました
          required: true
        - label: この機能が公式サイトの「現状の制限」に記載されていないことを確認しました
          required: true

  - type: textarea
    id: problem
    attributes:
      label: 解決したい課題
      description: どのような場面で困っているか、なぜ必要かを書いてください。
      placeholder: "例: 会議の録音を後から字幕ファイルにしたいが、履歴の書き出しでは発話ごとの時刻がわからない。"
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 提案する機能
      description: 具体的にどのような動作を期待するかを書いてください。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 検討した代替案
      description: 別の方法や、今のバージョンで回避する方法があれば書いてください。
    validations:
      required: false

  - type: dropdown
    id: platform
    attributes:
      label: 関係するプラットフォーム
      multiple: true
      options:
        - Windows (x64)
        - macOS (Apple Silicon)
        - 両方
        - その他・わからない
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: 補足
      description: 参考リンク、スクリーンショット、関連する Issue などがあれば添付してください。
    validations:
      required: false
