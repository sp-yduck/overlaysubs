name: Feature request
description: Suggest a new feature or an improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. First check the [README](https://github.com/sp-yduck/overlaysubs#readme) and the existing issues to see whether the same proposal already exists.

        **Do not report security issues as public issues. Report them privately following [SECURITY.md](https://github.com/sp-yduck/overlaysubs/blob/main/SECURITY.md).**

  - type: checkboxes
    id: preflight
    attributes:
      label: Before you propose
      options:
        - label: I searched the existing issues and this proposal has not been made
          required: true
        - label: I checked that this feature is not listed under "Limitations" on the official site
          required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Describe the situation you are in and why you need this.
      placeholder: "e.g. I want to turn a recorded meeting into subtitle files, but the history export does not include timestamps per utterance."
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed feature
      description: Describe the behaviour you expect in concrete terms.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe any other approach or workaround with the current version.
    validations:
      required: false

  - type: dropdown
    id: platform
    attributes:
      label: Related platforms
      multiple: true
      options:
        - Windows (x64)
        - macOS (Apple Silicon)
        - Both
        - Other / not sure
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Add links, screenshots, related issues, and so on.
    validations:
      required: false
