version: 2
updates:
  # Rust workspace (root, crates/core, src-tauri) — one Cargo.lock at the root.
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "rust"
    commit-message:
      prefix: "chore(deps)"
    groups:
      cargo-patch:
        applies-to: "version-updates"
        update-types:
          - "patch"
      cargo-minor:
        applies-to: "version-updates"
        update-types:
          - "minor"

  # GitHub Actions used by .github/workflows/*.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(ci)"
    groups:
      github-actions:
        applies-to: "version-updates"
        update-types:
          - "patch"
          - "minor"
