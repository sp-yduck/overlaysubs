name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test -p floatsubs-core
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            features: vulkan
          - os: macos-14
            features: metal
    runs-on: ${{ matrix.os }}
    env:
      # libgit2 hits MAX_PATH on llama.cpp's submodule; the git CLI honours core.longpaths.
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    steps:
      - run: git config --global core.longpaths true
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - if: matrix.features == 'vulkan'
        shell: pwsh
        run: |
          $v = "1.4.313.2"
          curl.exe -fL -o vk.exe "https://sdk.lunarg.com/sdk/download/$v/windows/vulkansdk-windows-X64-$v.exe"
          ./vk.exe --accept-licenses --default-answer --confirm-command install | Out-Null
          if (!(Test-Path "C:\VulkanSDK\$v\Include\vulkan\vulkan.h")) { throw "Vulkan SDK install failed" }
          "VULKAN_SDK=C:\VulkanSDK\$v" >> $env:GITHUB_ENV
          "C:\VulkanSDK\$v\Bin" >> $env:GITHUB_PATH
      - run: cargo install tauri-cli --version "^2" --locked
      - run: cargo tauri build --features ${{ matrix.features }}
        working-directory: src-tauri
      - uses: actions/upload-artifact@v4
        with:
          name: floatsubs-${{ matrix.os }}
          path: |
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
            target/release/bundle/dmg/*.dmg
