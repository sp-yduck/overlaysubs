<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OverlaySubs overlay</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; }
  html { background: transparent; }
  /* The overlay tint and the caption colors come from the appearance settings; these CSS variables
     fall back to the stock look. */
  body { background: var(--overlay-bg, rgba(128,128,128,0.12)); border-radius: 8px; }
  body { display: flex; flex-direction: column; justify-content: var(--valign, flex-end); font-family: var(--font); cursor: default; user-select: none; }
  /* Taller than the overlay: the lines scroll instead of being clipped at the top. The thin,
     translucent scrollbar shows how much of the caption stack is above or below the view. */
  #lines { display: flex; flex-direction: column; gap: 6px; padding: 8px 12px; max-height: 100%; min-height: 0; overflow-x: hidden; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.5) transparent; }
  #lines::-webkit-scrollbar { width: 8px; }
  #lines::-webkit-scrollbar-track { background: transparent; }
  #lines::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.5); border-radius: 4px; }
  #lines::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.75); }
  .cap { align-self: var(--cap-align, center); max-width: 100%; text-align: var(--align, center); padding: 4px 14px; border-radius: 8px; background: var(--cap-bg, rgba(0,0,0,0.55)); color: var(--fg, #fff); font-size: var(--size, 28px); font-weight: var(--weight, 400); line-height: var(--line-height, 1.3); text-shadow: 0 1px 3px #000; }
  .cap .src { display: block; font-size: var(--src-size, 17px); color: var(--src-color, #cfd6e2); font-weight: 400; }
  .cap.partial .tr, .cap.streaming .tr { opacity: 0.6; }
  /* Top-aligned captions start below the drag grip drawn over the top of the overlay. */
  body.top #lines { padding-top: 26px; }
  #grip { position: fixed; left: 0; top: 0; right: 0; height: 18px; font: 11px/18px system-ui, sans-serif; color: #fff; text-align: center; text-shadow: 0 1px 2px #000; }
  body:hover #grip { background: rgba(255,255,255,0.15); cursor: move; }
  /* While the appearance settings are open, the grip stays visible with a hint so the overlay can be moved off them. */
  body.preview #grip { background: rgba(255,255,255,0.25); cursor: move; }
</style>
</head>
<body>
<div id="grip" data-tauri-drag-region></div>
<div id="lines"></div>
<script src="i18n.js"></script>
<script src="overlay-config.js"></script>
<script src="overlay.js"></script>
</body>
</html>
