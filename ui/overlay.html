<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>OverlaySubs overlay</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; }
  html { background: transparent; }
  /* transparent while idle; a faint tint appears on hover so the area can still be found */
  body { display: flex; flex-direction: column; justify-content: flex-end; font-family: var(--font); cursor: default; user-select: none; background: transparent; border-radius: 8px; }
  body:hover { background: rgba(128,128,128,0.12); }
  #lines { display: flex; flex-direction: column; gap: 6px; padding: 8px 12px; }
  .cap { align-self: center; max-width: 100%; text-align: center; padding: 4px 14px; border-radius: 8px; background: rgba(0,0,0,var(--bg)); color: #fff; font-size: var(--size); line-height: 1.3; text-shadow: 0 1px 3px #000; }
  .cap .src { display: block; font-size: 0.6em; color: #cfd6e2; }
  .cap.partial .tr, .cap.streaming .tr { opacity: 0.6; }
  #credit { position: fixed; right: 8px; bottom: 2px; font: 10px system-ui, sans-serif; color: #fff; opacity: 0.7; text-shadow: 0 1px 2px #000; }
  #grip { position: fixed; left: 0; top: 0; right: 0; height: 18px; }
  body:hover #grip { background: rgba(255,255,255,0.15); cursor: move; }
</style>
</head>
<body>
<div id="grip" data-tauri-drag-region></div>
<div id="lines"></div>
<div id="credit">Built with PLaMo</div>
<script src="i18n.js"></script>
<script src="overlay.js"></script>
</body>
</html>
