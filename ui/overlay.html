<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OverlaySubs overlay</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; }
  html { background: transparent; }
  /* faint tint so the overlay area can be found without hovering over it */
  body { background: rgba(128,128,128,0.12); border-radius: 8px; }
  body { display: flex; flex-direction: column; justify-content: flex-end; font-family: var(--font); cursor: default; user-select: none; }
  #lines { display: flex; flex-direction: column; gap: 6px; padding: 8px 12px; }
  .cap { align-self: center; max-width: 100%; text-align: center; padding: 4px 14px; border-radius: 8px; background: rgba(0,0,0,var(--bg)); color: #fff; font-size: var(--size); line-height: 1.3; text-shadow: 0 1px 3px #000; }
  .cap .src { display: block; font-size: 0.6em; color: #cfd6e2; }
  .cap.partial .tr, .cap.streaming .tr { opacity: 0.6; }
  #grip { position: fixed; left: 0; top: 0; right: 0; height: 18px; font: 11px/18px system-ui, sans-serif; color: #fff; text-align: center; text-shadow: 0 1px 2px #000; }
  body:hover #grip { background: rgba(255,255,255,0.15); cursor: move; }
  /* While the appearance settings are open, the grip stays visible with a hint so the overlay can be moved off them. */
  body.preview #grip { background: rgba(255,255,255,0.25); cursor: move; }
</style>
</head>
<body>
<div id="grip" data-tauri-drag-region></div>
<div id="lines"></div>
<script src="i18n.js"></script>
<script src="overlay.js"></script>
</body>
</html>
